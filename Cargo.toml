[package]
name = "magpie"
version = "0.1.0"
edition = "2021"
description = "Magpie — thorough seeker. TUI prompt -> crawl web -> PDF. Rust, offline-first."
license = "MIT"
publish = false

[[bin]]
name = "magpie"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
crossterm = "0.28"
url = "2"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
html-escape = "0.2"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
# lto/strip re-enable after green build (rustc SIGSEGV guard)
opt-level = 2
